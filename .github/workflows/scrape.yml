name: Scrape queue

on:
  # Ajastus tulee ulkoisesta cron-palvelusta, joka kutsuu workflow_dispatch-API:a 5 min välein.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scraper.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/queue.csv
          git diff --cached --quiet && exit 0
          git commit -m "Update queue data"
          git pull --rebase
          git push
