<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grill Room jonotilanne</title>
<meta name="description" content="Grill Room Hankasalmen keittiön jonotilanne ja kiireisimmät ja rauhallisimmat ajat.">
<style>
:root{
  color-scheme:light;
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10); --wash:rgba(11,11,11,.05);
  --busy:#d03b3b; --calm:#0ca30c; --line:#2a78d6; --neutral:#b9b7ae;
  --s-green:#0ca30c; --s-yellow:#fab219; --s-red:#d03b3b;
  --seq-0:#1f9d55; --seq-1:#6fb552; --seq-2:#b8c24d; --seq-3:#f2c94c; --seq-4:#f0a043; --seq-5:#e5693f; --seq-6:#cf3a3a;
  --empty:#efeee9;
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10); --wash:rgba(255,255,255,.07);
    --busy:#e66767; --calm:#0ca30c; --line:#3987e5; --neutral:#4a4a46;
    --seq-0:#1f9d55; --seq-1:#6fb552; --seq-2:#b8c24d; --seq-3:#f2c94c; --seq-4:#f0a043; --seq-5:#e5693f; --seq-6:#cf3a3a;
    --empty:#232321;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10); --wash:rgba(255,255,255,.07);
  --busy:#e66767; --calm:#0ca30c; --line:#3987e5; --neutral:#4a4a46;
  --seq-0:#1f9d55; --seq-1:#6fb552; --seq-2:#b8c24d; --seq-3:#f2c94c; --seq-4:#f0a043; --seq-5:#e5693f; --seq-6:#cf3a3a;
  --empty:#232321;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:24px 16px 48px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:20px}
h1{margin:0;font-size:1.5rem;letter-spacing:-.02em}
.sub{margin:2px 0 0;color:var(--ink-2);font-size:.9rem}
h2{margin:0 0 4px;font-size:1.05rem}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:14px;padding:20px;margin-bottom:16px}
.card > .hint,.hint{color:var(--ink-2);font-size:.85rem;margin:0 0 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:720px){.grid2{grid-template-columns:1fr}}

/* nykytila */
.now{display:grid;grid-template-columns:auto 1fr;gap:8px 28px;align-items:center}
@media(max-width:560px){.now{grid-template-columns:1fr}}
.hero{font-size:clamp(2.6rem,9vw,3.6rem);font-weight:800;line-height:1;letter-spacing:-.04em}
.now .lbl{font-size:1.15rem;font-weight:650;display:flex;align-items:center;gap:10px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--muted);box-shadow:0 0 0 4px var(--wash);flex:none}
.now .meta{color:var(--ink-2);font-size:.85rem;margin-top:4px}

/* suodatin */
.filters{display:inline-flex;border:1px solid var(--ring);border-radius:10px;overflow:hidden;background:var(--surface)}
.filters button{border:0;background:none;color:var(--ink-2);font:inherit;font-size:.85rem;padding:7px 13px;cursor:pointer}
.filters button+button{border-left:1px solid var(--ring)}
.filters button:hover{background:var(--wash)}
.filters button[aria-checked="true"]{color:var(--ink);font-weight:700;background:var(--wash)}
.filters button:focus-visible{outline:2px solid var(--line);outline-offset:-2px}

/* ydinlöydökset */
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:820px){.facts{grid-template-columns:repeat(2,1fr)}}
.fact{background:var(--surface);border:1px solid var(--ring);border-radius:14px;padding:14px 16px;border-top:4px solid var(--neutral)}
.fact.busy{border-top-color:var(--busy)} .fact.calm{border-top-color:var(--calm)}
.fact .k{font-size:.78rem;color:var(--ink-2)}
.fact .v{font-size:1.35rem;font-weight:750;letter-spacing:-.02em;margin:2px 0}
.fact .d{font-size:.82rem;color:var(--ink-2)}

/* lämpökartta */
.heat{display:grid;grid-template-columns:52px repeat(7,minmax(0,1fr));gap:3px;align-items:stretch}
.heat .h{font-size:.78rem;color:var(--muted);text-align:center;padding-bottom:2px}
.heat .r{font-size:.78rem;color:var(--muted);text-align:right;padding-right:8px;align-self:center;font-variant-numeric:tabular-nums}
.cell{height:34px;border-radius:5px;border:0;padding:0;background:var(--empty)}
.cell[data-v]{cursor:default}
.cell:hover,.cell:focus-visible{outline:2px solid var(--ink);outline-offset:1px;position:relative;z-index:1}
.cell.none{background:repeating-linear-gradient(45deg,var(--empty),var(--empty) 4px,transparent 4px,transparent 8px)}
.legend{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:.78rem;color:var(--ink-2)}
.legend .ramp{height:10px;width:160px;border-radius:5px;background:linear-gradient(90deg,var(--seq-0),var(--seq-1),var(--seq-2),var(--seq-3),var(--seq-4),var(--seq-5),var(--seq-6))}
.swatches{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--ink-2);margin-bottom:12px}
.swatches i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:baseline}

/* palkit */
.bars{display:grid;gap:5px}
.bar{display:grid;grid-template-columns:78px 1fr 64px;align-items:center;gap:10px;font-size:.85rem}
.bar .n{color:var(--ink-2)}
.bar .t{height:18px;border-radius:0 4px 4px 0}
.bar .t span{display:block;height:100%;background:var(--neutral);border-radius:0 4px 4px 0;min-width:2px}
.bar.busy .t span{background:var(--busy)} .bar.calm .t span{background:var(--calm)}
.bar .val{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.bar.busy .val,.bar.calm .val{color:var(--ink);font-weight:700}
.bar.empty .val{color:var(--muted)}
.bar:hover{background:var(--wash);border-radius:4px}

/* top-listat */
.tops{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:720px){.tops{grid-template-columns:1fr}}
.tops h3{margin:0 0 6px;font-size:.9rem}
.tops ol{margin:0;padding-left:20px;font-size:.9rem;color:var(--ink-2)}
.tops li{padding:2px 0} .tops b{color:var(--ink)}

/* aikajana */
svg{display:block;width:100%;height:auto;overflow:visible}
.ax{font-size:11px;fill:var(--muted)}
.tl-wrap{position:relative}

/* tooltip */
#tip{position:fixed;z-index:10;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--ring);box-shadow:0 6px 24px rgba(0,0,0,.18);border-radius:10px;padding:9px 12px;font-size:.82rem;display:none;max-width:240px}
#tip .tv{font-size:1.05rem;font-weight:750}
#tip .ts{color:var(--ink-2)}

details{margin-top:14px;font-size:.85rem}
summary{cursor:pointer;color:var(--ink-2)}
table{border-collapse:collapse;margin-top:10px;width:100%;font-size:.8rem;font-variant-numeric:tabular-nums}
th,td{border:1px solid var(--grid);padding:4px 6px;text-align:center}
th{color:var(--ink-2);font-weight:600}

.note{background:var(--wash);border-radius:10px;padding:10px 14px;font-size:.85rem;color:var(--ink-2);margin-bottom:16px}
.err{padding:28px;text-align:center;color:var(--ink-2)}
footer{color:var(--muted);font-size:.78rem;margin-top:24px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Grill Room jonotilanne</h1>
      <p class="sub">Hankasalmi, Niemisjärvi · keittiön jonotusarvio, kun tilaus tehdään</p>
    </div>
    <div class="filters" role="radiogroup" aria-label="Aikaväli" id="filters">
      <button role="radio" aria-checked="false" data-days="7">7 vrk</button>
      <button role="radio" aria-checked="false" data-days="30">30 vrk</button>
      <button role="radio" aria-checked="false" data-days="90">90 vrk</button>
      <button role="radio" aria-checked="true" data-days="0">Kaikki</button>
    </div>
  </header>
  <div id="app"><div class="err">Ladataan…</div></div>
  <footer>Epävirallinen seurantasivu, jolla ei ole yhteyttä ravintolaan. Data haetaan grillroom.fi:n jonotusmittarista noin 5 minuutin välein. Ajat ovat Suomen aikaa.</footer>
</div>
<div id="tip"></div>

<script>
const DEMO = new URLSearchParams(location.search).has('demo');
const CSV_URL = DEMO ? 'data/demo.csv' : 'data/queue.csv';
const TZ = 'Europe/Helsinki';
const STEP = 5 * 60e3;          // havaintoväli
const MAX_CARRY = 6 * 3600e3;   // tilaa ei venytetä yli 6 h viimeisestä muutoksesta (data kirjataan vain muutoksista)
const OPEN_HOUR = 11, CLOSE_HOUR = 20; // aukiolo joka päivä 11-20 (grillroom.fi), Suomen aikaa
const MIN_SAMPLES = 6;          // vähintään ~30 min havaintoja, ennen kuin solu lasketaan
const WD = ['Ma','Ti','Ke','To','Pe','La','Su'];
const WD_LONG = ['maanantai','tiistai','keskiviikko','torstai','perjantai','lauantai','sunnuntai'];
const WD_IDX = {Mon:0,Tue:1,Wed:2,Thu:3,Fri:4,Sat:5,Sun:6};
// jos aikaväliä ei pysty lukemaan tekstistä (esim. "25–45 min"), arvioidaan värin mukaan
const COLOR_FALLBACK = {green:10, yellow:35, red:60};
const STATUS_COLOR = {green:'var(--s-green)', yellow:'var(--s-yellow)', red:'var(--s-red)'};

const $ = s => document.querySelector(s);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const fmtLocal = new Intl.DateTimeFormat('en-GB', {timeZone:TZ, weekday:'short', hour:'2-digit', hourCycle:'h23'});
const fmtDate = new Intl.DateTimeFormat('fi-FI', {timeZone:TZ, day:'numeric', month:'numeric'});
const fmtDateTime = new Intl.DateTimeFormat('fi-FI', {timeZone:TZ, weekday:'short', day:'numeric', month:'numeric', hour:'2-digit', minute:'2-digit'});

let ALL = [], rangeDays = 0;

/* ---------- data ---------- */
function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i+1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  const head = rows.shift() || [];
  return rows.filter(r => r.length === head.length).map(r => Object.fromEntries(head.map((h, i) => [h, r[i]])));
}
function toRow(r) {
  return {
    ts: Date.parse(r.fetched_at), closed: r.closed === 'True', available: r.available === 'True',
    time: r.time, label: r.label, color: r.color, hint: r.hint, updated: Date.parse(r.updated_at)
  };
}
function minutes(r) {
  if (r.closed || !r.available) return null;
  const n = (r.time.match(/\d+/g) || []).map(Number);
  if (n.length) return n.reduce((a, b) => a + b, 0) / n.length;
  return r.color in COLOR_FALLBACK ? COLOR_FALLBACK[r.color] : null;
}
function local(ts) {
  let wd = 0, h = 0;
  for (const p of fmtLocal.formatToParts(ts)) { if (p.type === 'weekday') wd = WD_IDX[p.value]; if (p.type === 'hour') h = +p.value; }
  return [wd, h];
}
const stripEmoji = s => s.replace(/^\p{Extended_Pictographic}️?\s*/u, '');
const hourLabel = h => `${h}–${h + 1}`;
const rel = ms => { const m = Math.round(ms / 60e3); if (m < 1) return 'juuri nyt'; if (m < 60) return `${m} min sitten`; const h = Math.floor(m / 60); if (h < 48) return `${h} h sitten`; return `${Math.floor(h / 24)} vrk sitten`; };

/* tasaisin välein otetut havainnot muutoslokista */
function buildSamples(rows, from, to) {
  const out = []; let i = 0;
  for (let t = Math.max(from, rows[0].ts); t <= to; t += STEP) {
    while (i + 1 < rows.length && rows[i + 1].ts <= t) i++;
    const r = rows[i];
    if (t - r.ts > MAX_CARRY) continue;
    const v = minutes(r);
    if (v == null) continue;
    const [wd, h] = local(t);
    if (h < OPEN_HOUR || h >= CLOSE_HOUR) continue; // suljettuna API:n tuloksia ei huomioida
    out.push({t, wd, h, v, row: r});
  }
  return out;
}
function aggregate(samples) {
  const cell = new Map(), byWd = Array.from({length:7}, () => [0, 0]), byH = new Map();
  for (const s of samples) {
    const k = s.wd * 100 + s.h; const c = cell.get(k) || [0, 0]; c[0] += s.v; c[1]++; cell.set(k, c);
    byWd[s.wd][0] += s.v; byWd[s.wd][1]++;
    const b = byH.get(s.h) || [0, 0]; b[0] += s.v; b[1]++; byH.set(s.h, b);
  }
  return {cell, byWd, byH};
}
const mean = a => a && a[1] >= MIN_SAMPLES ? a[0] / a[1] : null;

/* ---------- tooltip ---------- */
const tip = $('#tip');
function showTip(e, title, value, sub) {
  tip.replaceChildren(el('div', 'ts', title), el('div', 'tv', value), el('div', 'ts', sub));
  tip.style.display = 'block';
  const pad = 14, r = tip.getBoundingClientRect();
  let x = e.clientX + pad, y = e.clientY + pad;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - pad;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
}
const hideTip = () => { tip.style.display = 'none'; };
function hover(node, fn) {
  const go = e => { const rect = node.getBoundingClientRect(); fn(e.clientX ? e : {clientX: rect.right, clientY: rect.top}); };
  node.addEventListener('pointermove', go); node.addEventListener('focus', go);
  node.addEventListener('pointerleave', hideTip); node.addEventListener('blur', hideTip);
}

/* ---------- värit ---------- */
function ramp() {
  const cs = getComputedStyle(document.documentElement);
  return Array.from({length:7}, (_, i) => cs.getPropertyValue(`--seq-${i}`).trim()).map(h => [1, 3, 5].map(j => parseInt(h.slice(j, j + 2), 16)));
}
function seqColor(t, stops) {
  const x = Math.min(1, Math.max(0, t)) * (stops.length - 1), i = Math.min(stops.length - 2, Math.floor(x)), f = x - i;
  return 'rgb(' + stops[i].map((c, k) => Math.round(c + (stops[i + 1][k] - c) * f)).join(',') + ')';
}

/* ---------- osiot ---------- */
function sectionNow(rows) {
  const r = rows[rows.length - 1], card = el('section', 'card');
  const now = Date.now(), [, h] = local(now);
  const closedNow = h < OPEN_HOUR || h >= CLOSE_HOUR;
  const unavailable = closedNow || r.closed || !r.available;
  const waiting = !closedNow && r.closed && now - r.ts > (h - OPEN_HOUR + 1) * 3600e3; // vanha "suljettu"-rivi ennen avautumista
  const g = el('div', 'now');
  g.append(el('div', 'hero', closedNow || (r.closed && !waiting) ? 'Suljettu' : unavailable ? '–' : r.time));
  const side = el('div');
  const lbl = el('div', 'lbl'); const dot = el('span', 'dot');
  if (STATUS_COLOR[r.color] && !unavailable) dot.style.background = STATUS_COLOR[r.color];
  let text;
  if (closedNow) text = h < OPEN_HOUR ? `Avautuu tänään klo ${OPEN_HOUR}` : `Avautuu huomenna klo ${OPEN_HOUR}`;
  else if (waiting) text = 'Odotetaan päivän ensimmäistä arviota';
  else if (r.closed) text = 'Ravintola on suljettu';
  else if (!r.available) text = 'Arviota ei ole saatavilla';
  else text = stripEmoji(r.label);
  lbl.append(dot, el('span', null, text));
  side.append(lbl);
  if (closedNow) {
    side.append(el('div', 'meta', `Avoinna joka päivä ${OPEN_HOUR}–${CLOSE_HOUR}. Jonotilannetta ei seurata suljettuna aikana.`));
    const last = [...rows].reverse().find(x => minutes(x) != null);
    if (last) side.append(el('div', 'meta', `Viimeisin arvio: ${last.time} (${fmtDateTime.format(last.ts)})`));
  } else {
    if (r.hint && !unavailable) side.append(el('div', 'meta', r.hint));
    side.append(el('div', 'meta', `Tila muuttunut ${rel(now - r.ts)} (${fmtDateTime.format(r.ts)})`));
  }
  g.append(side); card.append(g);
  return card;
}

function sectionFacts(agg) {
  const wrap = el('div', 'facts');
  const wds = agg.byWd.map((a, i) => ({i, v: mean(a)})).filter(x => x.v != null).sort((a, b) => b.v - a.v);
  const hrs = [...agg.byH].map(([h, a]) => ({h, v: mean(a)})).filter(x => x.v != null).sort((a, b) => b.v - a.v);
  const mk = (cls, k, v, d) => { const f = el('div', 'fact ' + cls); f.append(el('div', 'k', k), el('div', 'v', v), el('div', 'd', d)); return f; };
  const cap = s => s[0].toUpperCase() + s.slice(1);
  if (wds.length >= 2) {
    const b = wds[0], c = wds[wds.length - 1];
    wrap.append(mk('busy', 'Kiireisin päivä', cap(WD_LONG[b.i]), `keskimäärin ${Math.round(b.v)} min`));
    wrap.append(mk('calm', 'Rauhallisin päivä', cap(WD_LONG[c.i]), `keskimäärin ${Math.round(c.v)} min`));
  }
  if (hrs.length >= 2) {
    const b = hrs[0], c = hrs[hrs.length - 1];
    wrap.append(mk('busy', 'Kiireisin kellonaika', `klo ${hourLabel(b.h)}`, `keskimäärin ${Math.round(b.v)} min`));
    wrap.append(mk('calm', 'Rauhallisin kellonaika', `klo ${hourLabel(c.h)}`, `keskimäärin ${Math.round(c.v)} min`));
  }
  return wrap.children.length ? wrap : null;
}

function sectionHeat(agg, hours) {
  const card = el('section', 'card');
  card.append(el('h2', null, 'Milloin on kiireistä?'), el('p', 'hint', 'Keskimääräinen jonotusarvio viikonpäivän ja kellonajan mukaan. Väriasteikko on alla.'));
  const cells = [...agg.cell].map(([k, a]) => ({k, v: mean(a), n: a[1]})).filter(x => x.v != null);
  if (!cells.length) { card.append(el('div', 'err', 'Havaintoja ei ole vielä tarpeeksi.')); return card; }
  const lo = Math.min(...cells.map(c => c.v)), hi = Math.max(...cells.map(c => c.v)), stops = ramp();
  const grid = el('div', 'heat');
  grid.append(el('div')); WD.forEach(d => grid.append(el('div', 'h', d)));
  for (const h of hours) {
    grid.append(el('div', 'r', hourLabel(h)));
    for (let d = 0; d < 7; d++) {
      const a = agg.cell.get(d * 100 + h), v = mean(a);
      const b = el('button', 'cell' + (v == null ? ' none' : ''));
      b.type = 'button';
      const name = `${WD_LONG[d]} klo ${hourLabel(h)}`;
      if (v == null) { b.setAttribute('aria-label', `${name}: ei vielä dataa`); hover(b, e => showTip(e, name, 'Ei vielä dataa', 'Havaintoja kertyy lisää')); }
      else {
        b.style.background = seqColor((v - lo) / ((hi - lo) || 1), stops);
        b.setAttribute('aria-label', `${name}: keskimäärin ${Math.round(v)} minuuttia`);
        hover(b, e => showTip(e, name, `≈ ${Math.round(v)} min`, `${(a[1] * STEP / 3600e3).toFixed(1)} h havaintoja`));
      }
      grid.append(b);
    }
  }
  const lg = el('div', 'legend');
  lg.append(el('span', null, `Rauhallinen ${Math.round(lo)} min`), el('span', 'ramp'), el('span', null, `Kiireinen ${Math.round(hi)} min`), el('span', null, '· raidoitettu = ei vielä dataa'));
  card.append(grid, lg);

  // kiireisimmät ja rauhallisimmat hetket
  const sorted = [...cells].sort((a, b) => b.v - a.v), top = sorted.slice(0, 3), low = sorted.slice(-3).reverse();
  if (sorted.length >= 6) {
    const tops = el('div', 'tops'); tops.style.marginTop = '18px';
    const col = (title, list) => { const d = el('div'); d.append(el('h3', null, title)); const ol = el('ol');
      list.forEach(c => { const li = el('li'); const b = el('b', null, `${WD_LONG[Math.floor(c.k / 100)]} klo ${hourLabel(c.k % 100)}`); li.append(b, ` · ${Math.round(c.v)} min`); ol.append(li); });
      d.append(ol); return d; };
    tops.append(col('Kiireisimmät hetket', top), col('Rauhallisimmat hetket', low));
    card.append(tops);
  }
  // taulukkonäkymä
  const det = el('details'); det.append(el('summary', null, 'Näytä taulukkona'));
  const tbl = el('table'); const hr = el('tr'); hr.append(el('th', null, 'Klo')); WD.forEach(d => hr.append(el('th', null, d))); tbl.append(hr);
  for (const h of hours) { const tr = el('tr'); tr.append(el('th', null, hourLabel(h))); for (let d = 0; d < 7; d++) { const v = mean(agg.cell.get(d * 100 + h)); tr.append(el('td', null, v == null ? '–' : Math.round(v))); } tbl.append(tr); }
  det.append(tbl); card.append(det);
  return card;
}

function sectionBars(agg, hours) {
  const wrap = el('section', 'card');
  wrap.append(el('h2', null, 'Päivät ja kellonajat'), el('p', 'hint', 'Keskimääräinen jonotusarvio minuutteina.'));
  const sw = el('div', 'swatches');
  [['--busy', 'Kiireisin'], ['--calm', 'Rauhallisin'], ['--neutral', 'Muut']].forEach(([c, t]) => { const s = el('span'); const i = el('i'); i.style.background = `var(${c})`; s.append(i, t); sw.append(s); });
  wrap.append(sw);
  const g = el('div', 'grid2');
  const build = (title, items, maxV) => {
    const box = el('div'); box.append(el('h3', null, title)); box.firstChild.style.cssText = 'margin:0 0 8px;font-size:.9rem';
    const vals = items.filter(x => x.v != null).map(x => x.v), lo = Math.min(...vals), hi = Math.max(...vals);
    const list = el('div', 'bars');
    for (const it of items) {
      const cls = it.v == null ? 'empty' : (vals.length >= 2 && it.v === hi ? 'busy' : vals.length >= 2 && it.v === lo ? 'calm' : '');
      const row = el('div', 'bar ' + cls);
      const t = el('div', 't'); const s = el('span'); s.style.width = it.v == null ? '2px' : Math.max(1, it.v / maxV * 100) + '%'; t.append(s);
      row.append(el('div', 'n', it.name), t, el('div', 'val', it.v == null ? '–' : `${Math.round(it.v)} min`));
      row.tabIndex = 0; row.setAttribute('aria-label', `${it.name}: ${it.v == null ? 'ei vielä dataa' : Math.round(it.v) + ' minuuttia'}`);
      hover(row, e => showTip(e, it.name, it.v == null ? 'Ei vielä dataa' : `≈ ${Math.round(it.v)} min`, `${(it.n * STEP / 3600e3).toFixed(1)} h havaintoja`));
      list.append(row);
    }
    box.append(list); return box;
  };
  const wd = agg.byWd.map((a, i) => ({name: WD_LONG[i][0].toUpperCase() + WD_LONG[i].slice(1), v: mean(a), n: a[1]}));
  const hh = hours.map(h => { const a = agg.byH.get(h); return {name: `klo ${hourLabel(h)}`, v: mean(a), n: a ? a[1] : 0}; });
  const maxV = Math.max(1, ...[...wd, ...hh].map(x => x.v || 0));
  g.append(build('Viikonpäivän mukaan', wd, maxV), build('Kellonajan mukaan', hh, maxV));
  wrap.append(g); return wrap;
}

function sectionTimeline(rows) {
  const card = el('section', 'card');
  card.append(el('h2', null, 'Viimeiset 3 vuorokautta'), el('p', 'hint', `Jonotusarvion keskikohta ajan mukaan. Katkos = suljettu (avoinna ${OPEN_HOUR}–${CLOSE_HOUR}).`));
  const now = Date.now(), t0 = now - 3 * 86400e3;
  const pts = buildSamples(rows, t0, now);
  if (!pts.length) { card.append(el('div', 'err', 'Ei havaintoja viimeiseltä 3 vuorokaudelta.')); return card; }
  const W = 720, H = 200, m = {l:34, r:10, t:10, b:24}, iw = W - m.l - m.r, ih = H - m.t - m.b;
  const top = Math.max(30, Math.ceil(Math.max(...pts.map(s => s.v)) / 15) * 15), stepY = top > 90 ? 30 : 15;
  const X = t => m.l + (t - t0) / (now - t0) * iw, Y = v => m.t + ih - v / top * ih;
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg'); svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('role', 'img');
  svg.setAttribute('aria-label', 'Jonotusarvio viimeisen kolmen vuorokauden ajalta');
  const add = (tag, attrs, text) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (text != null) n.textContent = text; svg.append(n); return n; };
  for (let v = 0; v <= top; v += stepY) { add('line', {x1:m.l, x2:W - m.r, y1:Y(v), y2:Y(v), stroke: v ? 'var(--grid)' : 'var(--axis)', 'stroke-width':1}); add('text', {x:m.l - 6, y:Y(v) + 4, 'text-anchor':'end', class:'ax'}, v); }
  for (let t = Math.ceil(t0 / 3600e3) * 3600e3; t <= now; t += 3600e3) {
    const [, h] = local(t); if (h % 12) continue;
    const x = X(t); add('line', {x1:x, x2:x, y1:m.t, y2:m.t + ih, stroke:'var(--grid)', 'stroke-width':1});
    add('text', {x, y:H - 6, 'text-anchor':'middle', class:'ax'}, h === 0 ? `${WD[local(t + 3600e3)[0]]} ${fmtDate.format(t + 3600e3)}` : '12:00');
  }
  let d = '', prev = null;
  for (const s of pts) {
    d += (prev && s.t - prev.t <= STEP) ? `H${X(s.t)}V${Y(s.v)}` : `M${X(s.t)} ${Y(s.v)}`;
    prev = s;
  }
  d += prev ? `H${X(prev.t + STEP)}` : '';
  add('path', {d, fill:'none', stroke:'var(--line)', 'stroke-width':2, 'stroke-linejoin':'round'});
  const cross = add('line', {y1:m.t, y2:m.t + ih, stroke:'var(--ink-2)', 'stroke-width':1, visibility:'hidden'});
  const hit = add('rect', {x:m.l, y:m.t, width:iw, height:ih, fill:'transparent'});
  hit.addEventListener('pointermove', e => {
    const b = svg.getBoundingClientRect(), px = (e.clientX - b.left) / b.width * W;
    const t = t0 + Math.min(1, Math.max(0, (px - m.l) / iw)) * (now - t0);
    cross.setAttribute('x1', X(t)); cross.setAttribute('x2', X(t)); cross.setAttribute('visibility', 'visible');
    const s = pts.find(s => t >= s.t && t < s.t + STEP);
    showTip(e, fmtDateTime.format(t), s ? s.row.time : 'Suljettu', s ? stripEmoji(s.row.label) + (s.row.hint ? ' · ' + s.row.hint : '') : `Avoinna ${OPEN_HOUR}–${CLOSE_HOUR}`);
  });
  hit.addEventListener('pointerleave', () => { cross.setAttribute('visibility', 'hidden'); hideTip(); });
  const w = el('div', 'tl-wrap'); w.append(svg); card.append(w);
  return card;
}

/* ---------- pääpiirto ---------- */
function render() {
  const app = $('#app'); app.replaceChildren();
  if (!ALL.length) { app.append(el('div', 'err', 'Dataa ei ole vielä. Ensimmäinen havainto ilmestyy, kun scraper on ajanut.')); return; }
  const now = Date.now();
  const from = rangeDays ? now - rangeDays * 86400e3 : 0;
  const samples = buildSamples(ALL, from, now);
  const agg = aggregate(samples);
  const hours = Array.from({length: CLOSE_HOUR - OPEN_HOUR}, (_, i) => OPEN_HOUR + i);

  if (DEMO) app.append(el('div', 'note', 'Esikatselu: tämä on näennäistä testidataa (make_demo.py), ei ravintolan oikeita lukuja.'));
  app.append(sectionNow(ALL));
  const start = Math.max(from, ALL[0].ts), days = (now - start) / 86400e3;
  if (days < 14) app.append(el('div', 'note', `Dataa on ${days < 1 ? 'alle vuorokauden' : Math.floor(days) + ' vrk'} ajalta (alkaen ${fmtDate.format(start)}). Löydökset tarkentuvat, kun havaintoja kertyy useammalta viikolta.`));
  const facts = sectionFacts(agg); if (facts) app.append(facts);
  const enough = [...agg.cell.values()].some(a => a[1] >= MIN_SAMPLES);
  app.append(sectionHeat(agg, hours));
  if (enough) app.append(sectionBars(agg, hours));
  app.append(sectionTimeline(ALL));
}

$('#filters').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  rangeDays = +b.dataset.days;
  document.querySelectorAll('#filters button').forEach(x => x.setAttribute('aria-checked', String(x === b)));
  render();
});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => ALL.length && render());

fetch(CSV_URL, {cache:'no-store'})
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(t => { ALL = parseCSV(t).map(toRow).filter(r => !isNaN(r.ts)).sort((a, b) => a.ts - b.ts); render(); })
  .catch(() => { $('#app').replaceChildren(el('div', 'err', 'Dataa ei voitu ladata. Jos avasit tiedoston suoraan levyltä, aja se palvelimen kautta (python3 -m http.server).')); });
</script>
